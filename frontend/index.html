<!DOCTYPE html>
<html>
<head>
    <title>Course Registration System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4e73df,#1cc88a);
        }

        .container{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            text-align:center;
            width:450px;
        }

        h2{
            color:#333;
            margin-bottom:30px;
            font-size:28px;
        }

        .btn{
            display:block;
            width:100%;
            padding:15px;
            margin:15px 0;
            border:none;
            border-radius:8px;
            background:#4e73df;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#2e59d9;
            transform:translateY(-2px);
        }

        a{
            text-decoration:none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>📚 Course Registration System</h2>

        <a href="register.html">
            <button class="btn">Register Course</button>
        </a>

        <a href="availableCourse.html">
            <button class="btn">Available Courses</button>
        </a>

        <a href="enrolledStudents.html">
            <button class="btn">Enrolled Students</button>
        </a>
    </div>

</body>
</html>
