<!DOCTYPE html>
<html>
<head>
    <title>Register Course</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            background:white;
            width:450px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }

        input,
        select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus,
        select:focus{
            border-color:#667eea;
            box-shadow:0 0 5px rgba(102,126,234,0.4);
        }

        button{
            width:100%;
            padding:14px;
            background:#667eea;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#5563d6;
        }

        .home-btn{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#667eea;
            font-weight:bold;
        }

        .home-btn:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>📚 Register Course</h2>

        <form action="http://localhost:8081/course/register" method="post">

            <div class="form-group">
                <label for="name">Enter Your Name</label>
                <input type="text" name="name" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="emailid">Enter Your Email</label>
                <input type="email" name="emailid" id="emailid" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="coursename">Choose a Course</label>
                <select id="coursename" name="coursename">
                    <option value="Java">Java</option>
                    <option value="Python">Python</option>
                    <option value="UI/UX">UI/UX</option>
                    <option value="MERN Stack">MERN Stack</option>
                    <option value="Spring Boot">Spring Boot</option>
                </select>
            </div>

            <button type="submit">Register Now</button>

        </form>

        <a href="index.html" class="home-btn">← Back to Home</a>

    </div>

</body>
</html>
